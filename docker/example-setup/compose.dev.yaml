# This file was generated by setup-workbench.sh
# It will be automatically merged with compose.yaml when running docker compose commands

services:

  frontend:
    image: attack-workbench-frontend
    build:
      context: ../../../attack-workbench-frontend
      target: dev
    environment:
      - WORKBENCH_FRONTEND_API_PROXY_TARGET=http://rest-api:3000
    ports: !override
      - "${ATTACKWB_FRONTEND_HTTP_PORT:-80}:80"
    volumes: !override
      - "${ATTACKWB_FRONTEND_CONFIG_DIR:-./configs/frontend}:/etc/workbench:ro"
      - type: bind
        source: ../../../attack-workbench-frontend/src
        target: /workspace/src
        read_only: true
        bind:
          create_host_path: false
    develop:
      watch:
        # Angular polls source; restart it to discover newly added static assets.
        - action: restart
          path: ../../../attack-workbench-frontend/src/assets
        - action: restart
          # Watch the directory so adding/removing optional config.json is detected.
          path: ${ATTACKWB_FRONTEND_CONFIG_DIR:-./configs/frontend}
          ignore:
            - .env
            - template.env
            - '*.conf'
        # Rebuild on Angular build configuration changes
        - action: rebuild
          path: ../../../attack-workbench-frontend/angular.json
        - action: rebuild
          path: ../../../attack-workbench-frontend/proxy.conf.cjs
        - action: rebuild
          path: ../../../attack-workbench-frontend/scripts
        - action: rebuild
          path: ../../../attack-workbench-frontend/tsconfig.json
        - action: rebuild
          path: ../../../attack-workbench-frontend/tsconfig.app.json
        # Rebuild on package.json changes
        - action: rebuild
          path: ../../../attack-workbench-frontend/package.json
        - action: rebuild
          path: ../../../attack-workbench-frontend/package-lock.json

  rest-api:
    image: attack-workbench-rest-api
    build:
      context: ../../../attack-workbench-rest-api
      target: dev
    volumes:
      - type: bind
        source: ../../../attack-workbench-rest-api/app
        target: /usr/src/app/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../../attack-workbench-rest-api/bin
        target: /usr/src/app/bin
        read_only: true
        bind:
          create_host_path: false
    develop:
      watch:
        # Restart the API to load edits from its source mounts
        - action: restart
          path: ../../../attack-workbench-rest-api/app
        # Restart after server entrypoint and config changes
        - action: restart
          path: ../../../attack-workbench-rest-api/bin
        # The base compose file mounts this config before the API starts.
        - action: restart
          path: ${ATTACKWB_RESTAPI_CONFIG_FILE:-./configs/rest-api/rest-api-service-config.json}
        # Rebuild on package.json changes
        - action: rebuild
          path: ../../../attack-workbench-rest-api/package.json
        - action: rebuild
          path: ../../../attack-workbench-rest-api/package-lock.json

  taxii:
    image: attack-workbench-taxii-server
    build:
      context: ../../../attack-workbench-taxii-server
      target: development
    volumes:
      - type: bind
        source: ../../../attack-workbench-taxii-server/src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
    develop:
      watch:
        # Rebuild TypeScript and restart both TAXII server and collector
        - action: restart
          path: ../../../attack-workbench-taxii-server/src
        # Rebuild on package.json changes
        - action: rebuild
          path: ../../../attack-workbench-taxii-server/package.json
        - action: rebuild
          path: ../../../attack-workbench-taxii-server/package-lock.json
        # Rebuild when Nest or TypeScript build configuration changes
        - action: rebuild
          path: ../../../attack-workbench-taxii-server/nest-cli.json
        - action: rebuild
          path: ../../../attack-workbench-taxii-server/ecosystem.config.js
        - action: rebuild
          path: ../../../attack-workbench-taxii-server/tsconfig.json
        - action: rebuild
          path: ../../../attack-workbench-taxii-server/tsconfig.build.json
